<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 908 448" role="img" aria-label="Context: the plugin talks to Atmee's API and to the developer's LiveKit room; the GPU worker joins that room." xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, system-ui, sans-serif" style="max-width:100%;height:auto;display:block">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
  svg { color: #1b2a2e; }
  .t { fill: #1b2a2e; } .tm { fill: #5b6b70; }
  .node { fill: #ffffff; stroke: #1b2a2e; stroke-width: 1.2; }
  .node.new { fill: #fbeee2; stroke: #b4560e; }
  .node.db { fill: #e6f2f0; stroke: #3d8b84; }
  .node.dim { fill: #f5f8f7; stroke: #d5dedc; }
  .actor { fill: #e6f2f0; stroke: #3d8b84; stroke-width: 1.2; }
  .group { fill: #f5f8f7; stroke: #d5dedc; stroke-width: 1; }
  .edge { stroke: #1b2a2e; stroke-width: 1.3; fill: none; }
  .life { stroke: #d5dedc; stroke-width: 1; stroke-dasharray: 3 4; }
  .loop { fill: none; stroke: #2f5bea; stroke-width: 1; stroke-dasharray: 6 4; }
  .looptag { fill: #2f5bea; } .looptag + text { fill: #ffffff; }
  .plate { fill: #ffffff; } .note { fill: #fbeee2; stroke: #b4560e; stroke-width: 1; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect x="8" y="8" width="420" height="432" rx="6" class="group"/>
<text x="20.0" y="28.0" text-anchor="start" class="tm" font-size="11" font-weight="600">DEVELOPER</text>
<rect x="470" y="8" width="430" height="432" rx="6" class="group"/>
<text x="482.0" y="28.0" text-anchor="start" class="tm" font-size="11" font-weight="600">ATMEE</text>
<rect x="40" y="48" width="150" height="50" rx="4" class="node"/>
<text x="115.0" y="70.0" text-anchor="middle" class="t" font-size="12.5">Agent worker</text>
<text x="115.0" y="85.0" text-anchor="middle" class="t" font-size="12.5">(livekit-agents)</text>
<rect x="40" y="150" width="150" height="50" rx="4" class="node new"/>
<text x="115.0" y="172.0" text-anchor="middle" class="t" font-size="12.5">livekit.plugins.atmee</text>
<text x="115.0" y="187.0" text-anchor="middle" class="t" font-size="12.5">AvatarSession</text>
<rect x="40" y="302" width="150" height="50" rx="4" class="node"/>
<text x="115.0" y="331.5" text-anchor="middle" class="t" font-size="12.5">Browser</text>
<ellipse cx="322" cy="328" rx="82" ry="42" class="node"/><text x="322.0" y="324.5" text-anchor="middle" class="t" font-size="12.5">Developer's</text>
<text x="322.0" y="339.5" text-anchor="middle" class="t" font-size="12.5">LiveKit room</text>
<rect x="500" y="150" width="170" height="50" rx="4" class="node"/>
<text x="585.0" y="172.0" text-anchor="middle" class="t" font-size="12.5">session_service</text>
<text x="585.0" y="187.0" text-anchor="middle" class="t" font-size="12.5">api.atmanity.us</text>
<rect x="700" y="150" width="180" height="50" rx="4" class="node db"/>
<text x="790.0" y="172.0" text-anchor="middle" class="t" font-size="12.5">Supabase</text>
<text x="790.0" y="187.0" text-anchor="middle" class="t" font-size="12.5">avatars · sessions · billing</text>
<rect x="500" y="300" width="150" height="44" rx="4" class="node"/>
<text x="575.0" y="326.5" text-anchor="middle" class="t" font-size="12.5">Envoy</text>
<rect x="680" y="300" width="200" height="60" rx="4" class="node"/>
<text x="780.0" y="327.0" text-anchor="middle" class="t" font-size="12.5">avatar_service GPU pod</text>
<text x="780.0" y="342.0" text-anchor="middle" class="t" font-size="12.5">POST /lk_avatar</text>
<line x1="115.0" y1="98.0" x2="115.0" y2="146.0" class="edge" marker-end="url(#ah)"/>
<text x="123.0" y="127.0" text-anchor="start" class="tm" font-size="11.5">drives</text>
<line x1="190.0" y1="175.0" x2="496.0" y2="175.0" class="edge" marker-end="url(#ah)"/>
<text x="343.0" y="160.0" text-anchor="middle" class="tm" font-size="11.5">create · avatar_sessions · end</text>
<text x="343.0" y="194.0" text-anchor="middle" class="tm" font-size="11.5">[X-Api-Key]</text>
<line x1="670.0" y1="175.0" x2="696.0" y2="175.0" class="edge" marker-end="url(#ah)"/>
<text x="683.0" y="212.0" text-anchor="middle" class="tm" font-size="11">reserve</text>
<text x="683.0" y="224.0" text-anchor="middle" class="tm" font-size="11">tick</text>
<text x="683.0" y="236.0" text-anchor="middle" class="tm" font-size="11">finalize</text>
<line x1="585.0" y1="200.0" x2="585.0" y2="296.0" class="edge" marker-end="url(#ah)"/>
<text x="593.0" y="239.0" text-anchor="start" class="tm" font-size="11.5">POST /lk_avatar (in-cluster)</text>
<text x="593.0" y="253.0" text-anchor="start" class="tm" font-size="11.5">start events; ticks + end via callback</text>
<line x1="650.0" y1="322.0" x2="676.0" y2="322.0" class="edge" marker-end="url(#ah)"/>
<line x1="690.0" y1="360.0" x2="406.0" y2="336.0" class="edge" marker-end="url(#ah)"/>
<text x="560.0" y="379.0" text-anchor="middle" class="tm" font-size="11.5">joins as atmee-avatar-agent</text>
<text x="560.0" y="393.0" text-anchor="middle" class="tm" font-size="11.5">publishes video + audio</text>
<line x1="150.0" y1="200.0" x2="266.0" y2="296.0" class="edge" marker-end="url(#ah)"/>
<text x="218.0" y="225.0" text-anchor="start" class="tm" font-size="11.5">PCM over</text>
<text x="218.0" y="239.0" text-anchor="start" class="tm" font-size="11.5">lk.audio_stream</text>
<line x1="190.0" y1="327.0" x2="238.0" y2="328.0" class="edge" marker-end="url(#ah)"/>
<text x="214.0" y="318.0" text-anchor="middle" class="tm" font-size="11.5">WebRTC</text>
</svg>
