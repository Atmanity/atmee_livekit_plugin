<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 428" role="img" aria-label="Avatar creation from a portrait: four writes, then a ready avatar." xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, system-ui, sans-serif" style="max-width:100%;height:auto;display:block">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
  svg { color: #1b2a2e; }
  .t { fill: #1b2a2e; } .tm { fill: #5b6b70; }
  .node { fill: #ffffff; stroke: #1b2a2e; stroke-width: 1.2; }
  .node.new { fill: #fbeee2; stroke: #b4560e; }
  .node.db { fill: #e6f2f0; stroke: #3d8b84; }
  .node.dim { fill: #f5f8f7; stroke: #d5dedc; }
  .actor { fill: #e6f2f0; stroke: #3d8b84; stroke-width: 1.2; }
  .group { fill: #f5f8f7; stroke: #d5dedc; stroke-width: 1; }
  .edge { stroke: #1b2a2e; stroke-width: 1.3; fill: none; }
  .life { stroke: #d5dedc; stroke-width: 1; stroke-dasharray: 3 4; }
  .loop { fill: none; stroke: #2f5bea; stroke-width: 1; stroke-dasharray: 6 4; }
  .looptag { fill: #2f5bea; } .looptag + text { fill: #ffffff; }
  .plate { fill: #ffffff; } .note { fill: #fbeee2; stroke: #b4560e; stroke-width: 1; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<line x1="120" y1="52" x2="120" y2="424" class="life"/>
<line x1="380" y1="52" x2="380" y2="424" class="life"/>
<line x1="640" y1="52" x2="640" y2="424" class="life"/>
<rect x="25.0" y="8" width="190" height="44" rx="4" class="actor"/>
<text x="120.0" y="34.5" text-anchor="middle" class="t" font-size="12.5" font-weight="600">Developer</text>
<rect x="285.0" y="8" width="190" height="44" rx="4" class="actor"/>
<text x="380.0" y="34.5" text-anchor="middle" class="t" font-size="12.5" font-weight="600">session_service</text>
<rect x="545.0" y="8" width="190" height="44" rx="4" class="actor"/>
<text x="640.0" y="34.5" text-anchor="middle" class="t" font-size="12.5" font-weight="600">Supabase</text>
<rect x="133.8" y="78.0" width="232.3" height="34.0" rx="3" class="plate"/>
<text x="250.0" y="93.0" text-anchor="middle" class="t" font-size="12">POST /v1/avatars</text>
<text x="250.0" y="107.0" text-anchor="middle" class="t" font-size="12">(multipart image + name, no voice)</text>
<line x1="120.0" y1="121.0" x2="377.0" y2="121.0" class="edge" marker-end="url(#ah)"/>
<rect x="439.2" y="145.0" width="141.6" height="20.0" rx="3" class="plate"/>
<text x="510.0" y="160.0" text-anchor="middle" class="t" font-size="12">avatar_import_create</text>
<line x1="380.0" y1="174.0" x2="637.0" y2="174.0" class="edge" marker-end="url(#ah)"/>
<rect x="371.2" y="198.0" width="277.7" height="20.0" rx="3" class="plate"/>
<text x="510.0" y="213.0" text-anchor="middle" class="t" font-size="12">storage put ACCOUNT/AVATAR/source_image_*</text>
<line x1="380.0" y1="227.0" x2="637.0" y2="227.0" class="edge" marker-end="url(#ah)"/>
<rect x="358.2" y="251.0" width="303.6" height="20.0" rx="3" class="plate"/>
<text x="510.0" y="266.0" text-anchor="middle" class="t" font-size="12">avatar_import_set_config (kind = render_only)</text>
<line x1="380.0" y1="280.0" x2="637.0" y2="280.0" class="edge" marker-end="url(#ah)"/>
<rect x="400.3" y="304.0" width="219.4" height="34.0" rx="3" class="plate"/>
<text x="510.0" y="319.0" text-anchor="middle" class="t" font-size="12">avatar_import_set_default_config</text>
<text x="510.0" y="333.0" text-anchor="middle" class="t" font-size="12">(render config + portrait)</text>
<line x1="380.0" y1="347.0" x2="637.0" y2="347.0" class="edge" marker-end="url(#ah)"/>
<rect x="88.5" y="371.0" width="323.0" height="20.0" rx="3" class="plate"/>
<text x="250.0" y="386.0" text-anchor="middle" class="t" font-size="12">201 {avatarId, status: ready, kind: render_only}</text>
<line x1="380.0" y1="400.0" x2="123.0" y2="400.0" class="edge" stroke-dasharray="5 4" marker-end="url(#ah)"/>
</svg>
