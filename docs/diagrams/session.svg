<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1110 1235" role="img" aria-label="One avatar session from token minting to finalize; the GPU worker proves it is alive once a minute and reports the end to session_service." xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, system-ui, sans-serif" style="max-width:100%;height:auto;display:block">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
  svg { color: #1b2a2e; }
  .t { fill: #1b2a2e; } .tm { fill: #5b6b70; }
  .node { fill: #ffffff; stroke: #1b2a2e; stroke-width: 1.2; }
  .node.new { fill: #fbeee2; stroke: #b4560e; }
  .node.db { fill: #e6f2f0; stroke: #3d8b84; }
  .node.dim { fill: #f5f8f7; stroke: #d5dedc; }
  .actor { fill: #e6f2f0; stroke: #3d8b84; stroke-width: 1.2; }
  .group { fill: #f5f8f7; stroke: #d5dedc; stroke-width: 1; }
  .edge { stroke: #1b2a2e; stroke-width: 1.3; fill: none; }
  .life { stroke: #d5dedc; stroke-width: 1; stroke-dasharray: 3 4; }
  .loop { fill: none; stroke: #2f5bea; stroke-width: 1; stroke-dasharray: 6 4; }
  .looptag { fill: #2f5bea; } .looptag + text { fill: #ffffff; }
  .plate { fill: #ffffff; } .note { fill: #fbeee2; stroke: #b4560e; stroke-width: 1; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<line x1="120" y1="52" x2="120" y2="1231" class="life"/>
<line x1="410" y1="52" x2="410" y2="1231" class="life"/>
<line x1="700" y1="52" x2="700" y2="1231" class="life"/>
<line x1="990" y1="52" x2="990" y2="1231" class="life"/>
<rect x="25.0" y="8" width="190" height="44" rx="4" class="actor"/>
<text x="120.0" y="27.0" text-anchor="middle" class="t" font-size="12.5" font-weight="600">Agent job</text>
<text x="120.0" y="42.0" text-anchor="middle" class="t" font-size="12.5" font-weight="600">+ plugin</text>
<rect x="315.0" y="8" width="190" height="44" rx="4" class="actor"/>
<text x="410.0" y="34.5" text-anchor="middle" class="t" font-size="12.5" font-weight="600">session_service</text>
<rect x="605.0" y="8" width="190" height="44" rx="4" class="actor"/>
<text x="700.0" y="27.0" text-anchor="middle" class="t" font-size="12.5" font-weight="600">GPU pod</text>
<text x="700.0" y="42.0" text-anchor="middle" class="t" font-size="12.5" font-weight="600">/lk_avatar</text>
<rect x="895.0" y="8" width="190" height="44" rx="4" class="actor"/>
<text x="990.0" y="27.0" text-anchor="middle" class="t" font-size="12.5" font-weight="600">Developer's</text>
<text x="990.0" y="42.0" text-anchor="middle" class="t" font-size="12.5" font-weight="600">LiveKit room</text>
<rect x="40" y="673" width="1030" height="298" rx="4" class="loop"/>
<rect x="40" y="673" width="102" height="20" class="looptag"/>
<text x="49.0" y="687.0" text-anchor="start" class="t" font-size="11.5" font-weight="600">conversation</text>
<path d="M120,96.0 h 12 v 18 h -8" fill="none" class="edge" marker-end="url(#ah)"/>
<rect x="138.0" y="78.0" width="271.2" height="48.0" rx="3" class="plate"/>
<text x="142.0" y="93.0" text-anchor="start" class="t" font-size="12">mint LiveKit access token (JWT):</text>
<text x="142.0" y="107.0" text-anchor="start" class="t" font-size="12">kind=agent, identity=atmee-avatar-agent,</text>
<text x="142.0" y="121.0" text-anchor="start" class="t" font-size="12">lk.publish_on_behalf=agent</text>
<rect x="119.7" y="148.0" width="290.6" height="20.0" rx="3" class="plate"/>
<text x="265.0" y="163.0" text-anchor="middle" class="t" font-size="12">POST /v1/avatars/{avatarId}/avatar_sessions</text>
<line x1="120.0" y1="177.0" x2="407.0" y2="177.0" class="edge" marker-end="url(#ah)"/>
<path d="M410,219.0 h 12 v 18 h -8" fill="none" class="edge" marker-end="url(#ah)"/>
<rect x="428.0" y="201.0" width="206.4" height="48.0" rx="3" class="plate"/>
<text x="432.0" y="216.0" text-anchor="start" class="t" font-size="12">parse token → room, identity</text>
<text x="432.0" y="230.0" text-anchor="start" class="t" font-size="12">reserve session (billing_mode)</text>
<text x="432.0" y="244.0" text-anchor="start" class="t" font-size="12">load + presign avatar config</text>
<rect x="412.9" y="271.0" width="284.2" height="34.0" rx="3" class="plate"/>
<text x="555.0" y="286.0" text-anchor="middle" class="t" font-size="12">POST /lk_avatar {url, token, config,</text>
<text x="555.0" y="300.0" text-anchor="middle" class="t" font-size="12">session_id, callback_url, session_minutes}</text>
<line x1="410.0" y1="314.0" x2="697.0" y2="314.0" class="edge" marker-end="url(#ah)"/>
<rect x="497.2" y="338.0" width="115.7" height="20.0" rx="3" class="plate"/>
<text x="555.0" y="353.0" text-anchor="middle" class="t" font-size="12">SSE initializing</text>
<line x1="700.0" y1="367.0" x2="413.0" y2="367.0" class="edge" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<rect x="122.9" y="391.0" width="284.2" height="20.0" rx="3" class="plate"/>
<text x="265.0" y="406.0" text-anchor="middle" class="t" font-size="12">202 {sessionId, avatarParticipantIdentity}</text>
<line x1="410.0" y1="420.0" x2="123.0" y2="420.0" class="edge" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<path d="M120,448.0 h 12 v 18 h -8" fill="none" class="edge" marker-end="url(#ah)"/>
<rect x="138.0" y="444.0" width="323.0" height="20.0" rx="3" class="plate"/>
<text x="142.0" y="459.0" text-anchor="start" class="t" font-size="12">output.replace_audio_tail(DataStreamAudioOutput)</text>
<rect x="751.5" y="486.0" width="187.0" height="34.0" rx="3" class="plate"/>
<text x="845.0" y="501.0" text-anchor="middle" class="t" font-size="12">connect · publish</text>
<text x="845.0" y="515.0" text-anchor="middle" class="t" font-size="12">avatar_video + avatar_audio</text>
<line x1="700.0" y1="529.0" x2="987.0" y2="529.0" class="edge" marker-end="url(#ah)"/>
<rect x="406.4" y="553.0" width="297.1" height="34.0" rx="3" class="plate"/>
<text x="555.0" y="568.0" text-anchor="middle" class="t" font-size="12">SSE avatar_joined · user_joined (agent seen)</text>
<text x="555.0" y="582.0" text-anchor="middle" class="t" font-size="12">then the stream closes, as today</text>
<line x1="700.0" y1="596.0" x2="413.0" y2="596.0" class="edge" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<rect x="442.1" y="620.0" width="225.8" height="20.0" rx="3" class="plate"/>
<text x="555.0" y="635.0" text-anchor="middle" class="t" font-size="12">wait for the avatar's video track</text>
<line x1="120.0" y1="649.0" x2="987.0" y2="649.0" class="edge" marker-end="url(#ah)"/>
<rect x="471.2" y="703.0" width="167.5" height="20.0" rx="3" class="plate"/>
<text x="555.0" y="718.0" text-anchor="middle" class="t" font-size="12">PCM over lk.audio_stream</text>
<line x1="120.0" y1="732.0" x2="987.0" y2="732.0" class="edge" marker-end="url(#ah)"/>
<rect x="803.4" y="756.0" width="83.3" height="20.0" rx="3" class="plate"/>
<text x="845.0" y="771.0" text-anchor="middle" class="t" font-size="12">data stream</text>
<line x1="990.0" y1="785.0" x2="703.0" y2="785.0" class="edge" marker-end="url(#ah)"/>
<rect x="774.2" y="809.0" width="141.6" height="20.0" rx="3" class="plate"/>
<text x="845.0" y="824.0" text-anchor="middle" class="t" font-size="12">synced video + audio</text>
<line x1="700.0" y1="838.0" x2="987.0" y2="838.0" class="edge" marker-end="url(#ah)"/>
<rect x="383.8" y="862.0" width="342.5" height="34.0" rx="3" class="plate"/>
<text x="555.0" y="877.0" text-anchor="middle" class="t" font-size="12">POST callback_url {reason: rendering}  every 60 s</text>
<text x="555.0" y="891.0" text-anchor="middle" class="t" font-size="12">liveness tick; silence for 150 s closes the session</text>
<line x1="700.0" y1="905.0" x2="413.0" y2="905.0" class="edge" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<path d="M410,933.0 h 12 v 18 h -8" fill="none" class="edge" marker-end="url(#ah)"/>
<rect x="428.0" y="929.0" width="297.1" height="20.0" rx="3" class="plate"/>
<text x="432.0" y="944.0" text-anchor="start" class="t" font-size="12">metered tick (60 s) charges the elapsed time</text>
<rect x="403.2" y="983.0" width="303.6" height="34.0" rx="3" class="plate"/>
<text x="555.0" y="998.0" text-anchor="middle" class="t" font-size="12">aclose(): remove_participant(avatar)</text>
<text x="555.0" y="1012.0" text-anchor="middle" class="t" font-size="12">(LiveKit base class, developer's credentials)</text>
<line x1="120.0" y1="1026.0" x2="987.0" y2="1026.0" class="edge" marker-end="url(#ah)"/>
<rect x="393.5" y="1050.0" width="323.0" height="34.0" rx="3" class="plate"/>
<text x="555.0" y="1065.0" text-anchor="middle" class="t" font-size="12">POST callback_url {session_id, ended_at, reason}</text>
<text x="555.0" y="1079.0" text-anchor="middle" class="t" font-size="12">final report, retried with backoff for ~90 s</text>
<line x1="700.0" y1="1093.0" x2="413.0" y2="1093.0" class="edge" marker-end="url(#ah)"/>
<path d="M410,1121.0 h 12 v 18 h -8" fill="none" class="edge" marker-end="url(#ah)"/>
<rect x="428.0" y="1117.0" width="115.7" height="20.0" rx="3" class="plate"/>
<text x="432.0" y="1132.0" text-anchor="start" class="t" font-size="12">finalize billing</text>
<rect x="80" y="1159" width="950" height="58" rx="3" class="note"/>
<text x="555.0" y="1165.0" text-anchor="middle" class="t" font-size="12">The worker reports every end it can observe: agent left, room closed, participant removed, render error.</text>
<text x="555.0" y="1179.0" text-anchor="middle" class="t" font-size="12">A worker that dies is closed 150 s after its last tick, billed to that tick. Plugin /end is an optional explicit stop.</text>
<text x="555.0" y="1193.0" text-anchor="middle" class="t" font-size="12">The callback URL is the owning session_service pod; session_minutes makes the worker stop at the ceiling on its own.</text>
</svg>
